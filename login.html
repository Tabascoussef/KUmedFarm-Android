<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yashil Qahramonli Login Sahifasi</title>
  <meta name="description" content="Interaktiv login sahifasi – yashil hoodie kiygan 2D multfilm qahramoni bilan" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --dark-green: #047857;
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #132e22 0%, var(--bg) 70%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* Ambient background glow */
    .glow-sphere {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
    }

    .login-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      z-index: 1;
    }

    /* Cartoon Hero Canvas / Stage */
    .character-stage {
      position: relative;
      width: 100%;
      height: 100px;
      pointer-events: none;
    }

    .hero-boy {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 100px;
      transform-origin: bottom center;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.15s ease-out;
      will-change: transform, left;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
    }

    /* Entry Bounce Animation */
    .hero-boy.bounce-in {
      animation: heroDrop 1s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }

    @keyframes heroDrop {
      0% {
        transform: translateY(-380px) scale(0.7);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      65% {
        transform: translateY(12px) scale(1.15, 0.85);
      }
      80% {
        transform: translateY(-8px) scale(0.95, 1.05);
      }
      92% {
        transform: translateY(3px) scale(1.02, 0.98);
      }
      100% {
        transform: translateY(0) scale(1, 1);
        opacity: 1;
      }
    }

    /* Walking animation */
    .hero-boy.walking {
      animation: walkBob 0.22s infinite alternate ease-in-out;
    }

    @keyframes walkBob {
      0% {
        transform: translateY(0) rotate(-3deg);
      }
      100% {
        transform: translateY(-9px) rotate(3deg);
      }
    }

    /* Leg swinging when walking */
    .hero-boy.walking .left-leg {
      transform-origin: 34px 62px;
      animation: legSwing 0.22s infinite alternate ease-in-out;
    }
    .hero-boy.walking .right-leg {
      transform-origin: 46px 62px;
      animation: legSwing 0.22s infinite alternate-reverse ease-in-out;
    }

    @keyframes legSwing {
      0% { transform: rotate(-18deg); }
      100% { transform: rotate(18deg); }
    }

    /* Thumbs Up (Success state) */
    .hero-boy.thumbs-up .arm-right {
      transform-origin: 52px 42px;
      transform: rotate(-125deg) translateY(-2px);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hero-boy.thumbs-up .mouth-happy {
      opacity: 1 !important;
    }
    .hero-boy.thumbs-up .mouth-neutral {
      opacity: 0 !important;
    }
    .hero-boy.thumbs-up .blush {
      opacity: 0.65 !important;
    }

    /* Covering Eyes (Password visible state) */
    .hero-boy.covering-eyes .arm-left {
      transform-origin: 28px 42px;
      transform: rotate(120deg) translate(-2px, -8px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-boy.covering-eyes .arm-right {
      transform-origin: 52px 42px;
      transform: rotate(-120deg) translate(2px, -8px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-boy.covering-eyes .eyes-group {
      opacity: 0;
      transition: opacity 0.2s;
    }
    .hero-boy.covering-eyes .shy-blush {
      opacity: 0.9 !important;
    }

    /* Card styling */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.2rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(16, 185, 129, 0.08);
      position: relative;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.35rem;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Form controls */
    .input-field-wrapper {
      position: relative;
      margin-bottom: 1.35rem;
    }

    .field-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 0.45rem;
    }

    .input-inner {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      pointer-events: none;
      transition: color var(--transition);
    }

    .styled-input {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      padding: 0 2.8rem 0 2.85rem;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all var(--transition);
      outline: none;
    }

    .styled-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .input-inner:focus-within .field-icon {
      color: var(--primary);
    }

    /* Success indicator for email */
    .validation-badge {
      position: absolute;
      right: 1rem;
      display: flex;
      align-items: center;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--primary);
    }

    .validation-badge.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Password Toggle Button */
    .toggle-pass-btn {
      position: absolute;
      right: 0.75rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      transition: all var(--transition);
    }

    .toggle-pass-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      margin-top: 0.75rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(16, 185, 129, 0.45);
      filter: brightness(1.08);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Footer link */
    .card-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glow-sphere"></div>

  <div class="login-container">
    <!-- Character Walking Stage on top of form -->
    <div class="character-stage" id="characterStage">
      <!-- 2D Boy in Green Hoodie, Pants & Sneakers -->
      <svg id="heroBoy" class="hero-boy bounce-in" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hoodieGrad" x1="20" y1="36" x2="60" y2="68" gradientUnits="userSpaceOnUse">
            <stop stop-color="#10b981"/>
            <stop offset="1" stop-color="#047857"/>
          </linearGradient>
          <linearGradient id="pantsGrad" x1="25" y1="62" x2="55" y2="82" gradientUnits="userSpaceOnUse">
            <stop stop-color="#065f46"/>
            <stop offset="1" stop-color="#022c22"/>
          </linearGradient>
          <linearGradient id="skinGrad" x1="30" y1="12" x2="50" y2="34" gradientUnits="userSpaceOnUse">
            <stop stop-color="#fed7aa"/>
            <stop offset="1" stop-color="#fbd38d"/>
          </linearGradient>
        </defs>

        <!-- Shadow under character -->
        <ellipse cx="40" cy="95" rx="22" ry="4" fill="rgba(0,0,0,0.3)" />

        <!-- LEGS & SNEAKERS -->
        <!-- Left Leg -->
        <g class="left-leg">
          <rect x="29" y="62" width="9" height="23" rx="4" fill="url(#pantsGrad)" />
          <!-- Sneaker -->
          <path d="M26 82 C26 80, 39 80, 39 82 L39 87 C39 89, 23 89, 23 87 Z" fill="#ffffff" />
          <path d="M23 85 L39 85 L39 88 L23 88 Z" fill="#10b981" />
        </g>

        <!-- Right Leg -->
        <g class="right-leg">
          <rect x="42" y="62" width="9" height="23" rx="4" fill="url(#pantsGrad)" />
          <!-- Sneaker -->
          <path d="M41 82 C41 80, 54 80, 54 82 L57 87 C57 89, 41 89, 41 87 Z" fill="#ffffff" />
          <path d="M41 85 L57 85 L57 88 L41 88 Z" fill="#10b981" />
        </g>

        <!-- HOODIE BODY -->
        <path d="M23 38 C23 35, 57 35, 57 38 L55 64 C55 67, 25 67, 25 64 Z" fill="url(#hoodieGrad)" />
        <!-- Hoodie Pocket -->
        <path d="M29 52 C35 50, 45 50, 51 52 L49 61 C45 62, 35 62, 31 61 Z" fill="#047857" opacity="0.6"/>
        <!-- Hoodie Strings -->
        <line x1="37" y1="38" x2="37" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
        <line x1="43" y1="38" x2="43" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

        <!-- LEFT ARM -->
        <g class="arm-left">
          <rect x="18" y="38" width="8" height="20" rx="4" fill="url(#hoodieGrad)" />
          <!-- Hand -->
          <circle cx="22" cy="59" r="4.5" fill="url(#skinGrad)" />
        </g>

        <!-- RIGHT ARM -->
        <g class="arm-right">
          <rect x="54" y="38" width="8" height="20" rx="4" fill="url(#hoodieGrad)" />
          <!-- Hand -->
          <circle cx="58" cy="59" r="4.5" fill="url(#skinGrad)" />
          <!-- Thumbs Up Icon (visible on rotation) -->
          <path class="thumb-shape" d="M57 56 L57 51 C57 49, 61 49, 61 51 L61 56 Z" fill="url(#skinGrad)" />
        </g>

        <!-- HEAD & HOODIE BACK -->
        <!-- Green Hood Outline -->
        <path d="M24 24 C24 10, 56 10, 56 24 C56 38, 24 38, 24 24 Z" fill="#047857" />
        <!-- Face -->
        <ellipse cx="40" cy="25" rx="14" ry="13" fill="url(#skinGrad)" />

        <!-- Hair bangs -->
        <path d="M28 20 C32 15, 37 18, 41 15 C45 18, 50 16, 52 21 C48 18, 44 20, 40 18 C36 21, 31 18, 28 20 Z" fill="#4b2810" />

        <!-- Eyes -->
        <g class="eyes-group">
          <!-- Left Eye -->
          <ellipse cx="35" cy="24" rx="2.2" ry="3" fill="#1e293b" />
          <circle cx="35.7" cy="23.2" r="0.9" fill="#ffffff" />
          <!-- Right Eye -->
          <ellipse cx="45" cy="24" rx="2.2" ry="3" fill="#1e293b" />
          <circle cx="45.7" cy="23.2" r="0.9" fill="#ffffff" />
        </g>

        <!-- Cheeks / Blushes -->
        <circle class="blush" cx="31" cy="28" r="2.8" fill="#f87171" opacity="0" transition="opacity 0.3s" />
        <circle class="blush" cx="49" cy="28" r="2.8" fill="#f87171" opacity="0" transition="opacity 0.3s" />
        <ellipse class="shy-blush" cx="40" cy="29" rx="11" ry="3" fill="#fb7185" opacity="0" transition="opacity 0.3s" />

        <!-- Mouths -->
        <!-- Neutral Mouth -->
        <path class="mouth-neutral" d="M37 31 C39 32, 41 32, 43 31" stroke="#4b2810" stroke-width="1.4" stroke-linecap="round" />
        <!-- Happy Smile (Thumbs Up) -->
        <path class="mouth-happy" d="M36 30 C38 34.5, 42 34.5, 44 30 Z" fill="#ef4444" opacity="0" transition="opacity 0.2s" />
      </svg>
    </div>

    <!-- Login Card -->
    <div class="card">
      <div class="card-header">
        <h1 class="card-title">Xush Kelibsiz!</h1>
        <p class="card-subtitle">Akkauntingizga kirish uchun ma'lumotlarni kiriting</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault();">
        <!-- Email Field -->
        <div class="input-field-wrapper" id="emailFieldGroup">
          <label class="field-label" for="emailInput">Elektron Pochta</label>
          <div class="input-inner">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="emailInput" 
              class="styled-input" 
              placeholder="ismingiz@misol.uz" 
              autocomplete="email"
              required 
            />
            <span class="validation-badge" id="emailBadge">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="input-field-wrapper" id="passwordFieldGroup">
          <label class="field-label" for="passwordInput">Maxfiy Parol</label>
          <div class="input-inner">
            <span class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="passwordInput" 
              class="styled-input" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required 
            />
            <button type="button" class="toggle-pass-btn" id="togglePassBtn" title="Parolni ko'rsatish/yashirish" aria-label="Parolni ko'rsatish/yashirish">
              <!-- Eye Off (Hidden) -->
              <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
              <!-- Eye Open (Visible) -->
              <svg id="eyeOnIcon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Kirish</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <div class="card-footer">
        Hisobingiz yo'qmi? <a href="#signup">Ro'yxatdan o'tish</a>
      </div>
    </div>
  </div>

  <script>
    // State machine & DOM elements
    const heroBoy = document.getElementById('heroBoy');
    const characterStage = document.getElementById('characterStage');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const emailBadge = document.getElementById('emailBadge');
    const togglePassBtn = document.getElementById('togglePassBtn');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const eyeOnIcon = document.getElementById('eyeOnIcon');

    let currentField = 'email';
    let walkTimeout = null;
    const charWidthFactor = 8.5; // Pixels to move per character
    const stageWidth = characterStage.clientWidth;
    const heroWidth = 80;

    // Helper: Calculate clamp position for hero along input width
    function calculateHeroPosition(textLength) {
      const maxLeft = stageWidth - heroWidth - 20;
      const baseLeft = 10;
      const targetLeft = baseLeft + (textLength * charWidthFactor);
      return Math.min(Math.max(baseLeft, targetLeft), maxLeft);
    }

    // Trigger walk animation temporarily
    function stepWalk() {
      heroBoy.classList.add('walking');
      clearTimeout(walkTimeout);
      walkTimeout = setTimeout(() => {
        heroBoy.classList.remove('walking');
      }, 250);
    }

    // Email validation regex (RFC compliant standard check)
    const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)+$/;

    function validateEmail(val) {
      const isValid = emailRegex.test(val.trim());
      if (isValid) {
        heroBoy.classList.add('thumbs-up');
        emailBadge.classList.add('active');
      } else {
        heroBoy.classList.remove('thumbs-up');
        emailBadge.classList.remove('active');
      }
      return isValid;
    }

    // 1. Initial State: Bounce in over email input
    heroBoy.addEventListener('animationend', (e) => {
      if (e.animationName === 'heroDrop') {
        heroBoy.classList.remove('bounce-in');
        updateHeroX(emailInput.value.length);
      }
    });

    function updateHeroX(length) {
      const x = calculateHeroPosition(length);
      heroBoy.style.left = `${x}px`;
    }

    // 2. Email typing listener: Walking & Validation
    emailInput.addEventListener('input', (e) => {
      currentField = 'email';
      stepWalk();
      updateHeroX(e.target.value.length);
      validateEmail(e.target.value);
    });

    // 3. Password focus: Character jumps/switches to password
    passwordInput.addEventListener('focus', () => {
      currentField = 'password';
      heroBoy.style.transform = 'translateY(-10px) scale(1.08)';
      setTimeout(() => {
        heroBoy.style.transform = 'translateY(0) scale(1)';
        updateHeroX(passwordInput.value.length);
      }, 180);
    });

    // Email focus return: Jumps back
    emailInput.addEventListener('focus', () => {
      currentField = 'email';
      heroBoy.style.transform = 'translateY(-10px) scale(1.08)';
      setTimeout(() => {
        heroBoy.style.transform = 'translateY(0) scale(1)';
        updateHeroX(emailInput.value.length);
        validateEmail(emailInput.value);
      }, 180);
    });

    // Password typing: Steps walk
    passwordInput.addEventListener('input', (e) => {
      currentField = 'password';
      stepWalk();
      updateHeroX(e.target.value.length);
    });

    // 4. Show/Hide Password Toggle: Covering eyes
    togglePassBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      if (isPassword) {
        // Show password
        passwordInput.setAttribute('type', 'text');
        eyeOffIcon.style.display = 'none';
        eyeOnIcon.style.display = 'block';
        
        // Character covers eyes (shy / bashful)
        heroBoy.classList.add('covering-eyes');
      } else {
        // Hide password
        passwordInput.setAttribute('type', 'password');
        eyeOffIcon.style.display = 'block';
        eyeOnIcon.style.display = 'none';
        
        // Character uncovers eyes
        heroBoy.classList.remove('covering-eyes');
      }
    });

    // Window resize adjustment
    window.addEventListener('resize', () => {
      const activeInput = currentField === 'email' ? emailInput : passwordInput;
      updateHeroX(activeInput.value.length);
    });

    // Set initial position
    updateHeroX(0);
  </script>
</body>
</html>
